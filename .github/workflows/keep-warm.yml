name: Keep Render service warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping application health endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Missing repository secret APP_URL"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 "${APP_URL%/}/health"
