envVarGroups:
  - name: football-neon-secrets
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: SHARED_PASSWORD
        value: "1234"
      - key: ADMIN_PASSWORD
        sync: false

services:
  - type: web
    name: football-class
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - fromGroup: football-neon-secrets
